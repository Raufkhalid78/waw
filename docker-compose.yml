services:
  # Typesense Search Engine (Self-hosted, Open Source)
  typesense:
    image: typesense/typesense:27.1
    container_name: waw-typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY in .env}
      - TYPESENSE_ENABLE_CORS=true
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8108/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Redis for Queues (Bull), OTP caching & Session Store
  redis:
    image: redis:7-alpine
    container_name: waw-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Local PostgreSQL instance (used if not connecting directly to Supabase Cloud)
  postgres:
    image: postgres:16-alpine
    container_name: waw-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waw_db}
      POSTGRES_USER: ${POSTGRES_USER:-waw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waw_user} -d ${POSTGRES_DB:-waw_db}"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  typesense_data:
  redis_data:
  postgres_data:
