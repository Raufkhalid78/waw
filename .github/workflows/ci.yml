name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx turbo run build --filter=@waw/types
      - name: TypeCheck web
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: TypeCheck API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: TypeCheck admin
        run: npx tsc --noEmit
        working-directory: apps/admin

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: supabase/postgres:15.6.1
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waw_test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test
      SUPABASE_SERVICE_ROLE_KEY: test
      JWT_SECRET: test-secret-key
      POSTEX_MERCHANT_ID: test
      POSTEX_MERCHANT_PASSWORD: test
      POSTEX_API_URL: https://test.postex.com.pk
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx turbo run build --filter=@waw/types
      - name: Run API tests
        run: npm test --workspace=@waw/api
        continue-on-error: true
      - name: Run web tests
        run: npm test --workspace=@waw/web
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t waw-web .
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t waw-api .
