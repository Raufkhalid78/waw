name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Env guard - no silent localhost fallbacks in production source
        run: |
          HITS=$(grep -rn --include='*.ts' --include='*.tsx' -E 'process\.env\.NEXT_PUBLIC_API_URL\s*\|\|\s*"http://localhost:4000"' apps/web/src apps/admin/src apps/seller/src | wc -l)
          if [ "$HITS" -gt 0 ]; then
            echo "::error::$HITS file(s) use a silent localhost:4000 fallback. Import API_BASE_URL from @waw/config instead."
            grep -rn --include='*.ts' --include='*.tsx' -E 'process\.env\.NEXT_PUBLIC_API_URL\s*\|\|\s*"http://localhost:4000"' apps/web/src apps/admin/src apps/seller/src
            exit 1
          fi
          echo "Env guard passed: no silent localhost fallbacks"
      - run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx turbo run build --filter=@waw/types --filter=@waw/config
      - name: TypeCheck web
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: TypeCheck API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: TypeCheck admin
        run: npx tsc --noEmit
        working-directory: apps/admin
      - name: TypeCheck seller
        run: npx tsc --noEmit
        working-directory: apps/seller

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      # The centralized API_BASE_URL config fails production builds without
      # this — CI builds with a staging URL so bundles resolve correctly.
      NEXT_PUBLIC_API_URL: https://api-staging.waw.com.pk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: supabase/postgres:15.6.1.146
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waw_test
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test
      SUPABASE_SERVICE_ROLE_KEY: test
      JWT_SECRET: test-secret-key
      POSTEX_MERCHANT_ID: test
      POSTEX_MERCHANT_PASSWORD: test
      POSTEX_API_URL: https://test.postex.com.pk
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx turbo run build --filter=@waw/types --filter=@waw/config
      - name: Apply Supabase Migrations
        run: npx supabase db push --db-url $DATABASE_URL
      - name: Load Staging Seed Data
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d waw_test -f supabase/seed.sql
      - name: Run API unit tests
        run: npm test --workspace=@waw/api
      - name: Run Integration RPC tests
        run: npx tsx --import ./tests/setup.ts --test tests/integration-rpcs.test.ts
        working-directory: apps/api

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: supabase/postgres:15.6.1.146
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/waw_e2e
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: test
      SUPABASE_SERVICE_ROLE_KEY: test
      JWT_SECRET: test-secret-key
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Apply Supabase Migrations
        run: npx supabase db push --db-url $DATABASE_URL
      - name: Load Staging Seed Data
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d waw_e2e -f supabase/seed.sql
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t waw-web .
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t waw-api .

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, e2e, docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
    # Required Railway setup (one-time):
    #   1. Four services named exactly: api, web, admin, seller
    #   2. On each service set the variable RAILWAY_CONFIG_NAME to its
    #      matching config: api -> railway.toml, web -> railway.web.toml,
    #      admin -> railway.admin.toml, seller -> railway.seller.toml
    #   3. Secret RAILWAY_TOKEN_STAGING (environment: staging) + var STAGING_API_URL
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Guard - verify deploy token is present
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::error::RAILWAY_TOKEN_STAGING secret is not set. Add it under Settings > Environments > staging to enable deploys."
          exit 1
      - name: Deploy API
        run: railway up --service api --ci
      - name: Deploy Web
        run: railway up --service web --ci
      - name: Deploy Admin
        run: railway up --service admin --ci
      - name: Deploy Seller
        run: railway up --service seller --ci
      - name: Verify API health
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$STAGING_API_URL/health" > /dev/null; then
              echo "API healthy after deploy"
              exit 0
            fi
            echo "Waiting for API health... ($i/12)"
            sleep 10
          done
          echo "::error::API health check failed after deploy"
          exit 1
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
